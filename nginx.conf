user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /app/logs/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /app/logs/nginx_access.log;
    sendfile on;
    keepalive_timeout 65;

    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    upstream streamlit_dashboard {
        server 127.0.0.1:8501;
    }

    server {
        listen 7860 default_server;
        listen [::]:7860 default_server;
        server_name _;

        client_max_body_size 50M;

        # REST API & System Endpoints -> FastAPI
        location ~ ^/(health|version|predict|verify|docs|openapi.json|analytics|telegram|operations) {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Streamlit Enterprise UI & WebSockets -> Streamlit
        location / {
            proxy_pass http://streamlit_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
